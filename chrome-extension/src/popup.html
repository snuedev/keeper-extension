<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Keeper</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!--
      Markup rather than a view file so it paints before the bundle parses,
      otherwise the popup flashes the sign-in screen at a signed-in user while
      Firebase looks up the stored session. popup.js replaces it.
    -->
    <div id="app">
      <header class="header">
        <h1 class="header__title">Keeper</h1>
      </header>
      <main class="panel">
        <p class="panel__hint">Loading…</p>
      </main>
    </div>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
